[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmt-musica"
version = "0.1.0"
description = "MUSICA-compatible Python interfaces to TMT's C libraries"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "xarray>=2024.1", "PyYAML>=6"]

[project.scripts]
tmt-prepare = "tmt.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
